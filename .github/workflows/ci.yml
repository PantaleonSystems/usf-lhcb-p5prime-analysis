name: validation

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yaml
          activate-environment: usf-lhc
          auto-activate-base: false

      - name: Validation suite
        run: make test

      - name: Rebuild the input CSV from the raw HEPData YAML
        run: |
          make data
          git diff --exit-code -- data/p5p_observables.csv

      - name: Run the fit and the cross-check
        run: |
          make fit
          make consistency

      # Re-run the suite against freshly generated results, so the tests that
      # read results/*.json check this run rather than the committed files.
      - name: Validation suite against regenerated results
        run: make test

      - name: Confirm the README block is up to date
        run: |
          make figures readme
          git diff --exit-code -- README.md
