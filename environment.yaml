name: usf-lhc
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26.*
  - scipy=1.11.*
  - pandas=2.1.*
  - matplotlib=3.8.*
  - emcee=3.1.*
  - corner=2.2.*
  - h5py=3.10.*
  - tqdm
  - pytest=7.4.*
  - pip
  - pip:
      - requests
      - pyyaml==6.0.*
      # Standard Model and new-physics predictions for b -> s l l observables.
      # Replaces the hard-coded P5'_SM interpolation table in scripts/utils.py.
      - flavio==2.7.*
      - wilson==2.4.*
